<html>
    <head>
        <title>bài 3 web</title>
    </head>
    <body>
        <MARQUEE>
            <b>hi hi</b>
        </MARQUEE>
        <!--ol danh sách có thứ tự -->
        <ol>
            <li>c#</li>
            <li>python</li>
            <li>javascript</li>
        </ol>
        <!--ol danh sách không có thứ tự -->
        <ul>
            <li>c#</li>
            <li>python</li>
            <li>javascript</li>
        </ul>
        <!--điền form -->
        <h1>Form đăng kí</h1>
        <form>
            <div>
                <b>họ và tên </b><br>
                <!--nếu input không có type thì mặc định là text -->
                <!--thuộc tính readonly sủ dụng khi không muốn người dùng nhạp thông tin vào input  -->
                <!--placeholder để hiện chữ mờ trong ô nhập  -->
                <input type="text" placeholder="họ và tên">
            </div>
            <div>
                <b>mật khẩu </b><br>
                
                <input type="password" placeholder="mật khẩu">
            </div>
            <div>
                <b> thiệu về bản thân </b><br>
                <!--textarea nhập nhiều thông tin-->
                <textarea>nhập thông tin...</textarea>
            </div>
            <div>
                <b>email </b><br>
                
                <input type="email">
            </div>
            <div>
                <input type="submit">
            </div>
            <!--sô đầu là 0 -->
            <!--sô 2 là 3,9,8 -->
            <!--8 số còn lại là 0-9  -->
            <div>
                <b>số điện thoại </b><br>
                
                <input type="tel" pattern="([0]{1})([3,9,8]{1})([0-9]{8})">
            </div>
            <div>
                <b>giới tính </b><br>
                
                <input type="radio" name="giới tính " value="nam">nam<br>
                <input type="radio" name="giới tính " value=" nữ">nữ
            </div>
            <div>
                <b>sở thích</b><br>
                
                chơi game:<input type="checkbox" name=" sở thích " value="chơi game"><br>
                nghe nhạc:<input type="checkbox" name="sở thích " value=" nghe nhạc"><br>
                thể thao:<input type="checkbox" name="sở thích " value="thể thao">
            </div>
            <div>
                <b>trình duyệt web ưa thích</b><br>
                <select name="browsers">
                    <option value="chrome">chrome</option>
                    <option value="firefox">firefox</option>
                    <option value="internet explore">internet explore</option>
                    <option value="opera">opera</option>
                    <option value="safari">safari</option>
                    <option value="coccoc">coccoc</option>
                </select>
                
                
            </div>
            0<input type="range" id="a"value="50">100
            <div>
                <b>năm sinh </b><br>
                
                <input type="number" placeholder="năm sinh"><br>
                

            </div>
            <div>
                
                <input type="submit" >
                <button>xác nhận</button>
                <input type="reset" >
                

            </div>

            
            
        </form>
        <iframe width="560" 
        height="315"
         src="https://www.youtube.com/embed/Zj3fTRFylrs?si=qGrkAe-oMoWyBNvM" allowfullscreen></iframe>



    </body>
</html>
