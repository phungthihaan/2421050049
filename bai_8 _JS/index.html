<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài 8-JS</title>
</head>

<body>
    <div>
Họ và tên:<input type="text" id="hovaten">
    </div>
    <div>
        <button  onclick="xinchao()">xin chào</button>
    </div>
    <div>
kết quả :<input type="text" id="ketqua">
    </div>
    <div>
        <h1>
            tính tổng 
        </h1>
    </div>
    <div>
số thứ 1 :<input type="number" id="sothunhat">
    </div>
    <div>
số thứ 2 :<input type="number" id="sothunhai">
    </div>
    <div>
        <button  onclick="tinhtong()">tính tổng </button>
    </div>
    <div>
kết quả  :<input type="number" id="tong">
    </div>

    

    <script>
        function tinhtong(){
             var so1= document.getElementById("sothunhat").value;
             var so2= document.getElementById("sothunhai").value;
             var tong=parseFloat(so1)+parseFloat(so2);
             document.getElementById("tong").value = tong;


        }
        //function- chỉ dùng khi được  gọi
        //để tạo function dùng cú pháp 
        //function + ten (){}
        // 1. hàm ko có tham số 
        function xinchao() {
            var ten= document.getElementById("hovaten").value;
            document.getElementById("ketqua").value = "xin chào "+ten;
          

        }

        //gọi hàm 
        xinchao();

        // 2. hàm có tham số 
        //function + ten ( tham số ){}
        // lưu ý : các tham số ngắn cách nhau bằng dấu ,
        function xinchao2(ten, tuoi) {
            document.writeln("xin chào   " + ten + " " + tuoi);
        }
        xinchao2("thủy", 21);

        function chuvi(dai, rong) {
            ketqua = (dai + rong) * 2;
            document.writeln("chu vi hình chữ nhật " + ketqua);

        }
        chuvi(5, 4);

        //dùng for in ra xin chào
        var danhSachSinhVien = ["thuy", "duong", "viet", "hue", "thang"];
        for (var i = 0; i < danhSachSinhVien.length; i++) {
            document.writeln("<br> ");
            document.writeln("xin chào " + danhSachSinhVien[i]);
        }
        for (var i = 0; i < danhSachSinhVien.length; i++) {

            if (danhSachSinhVien[i] != "viet") {
                document.writeln("<br> ");
                document.writeln("xin chào " + danhSachSinhVien[i]);
            }

        }

        //hàm có 2 tham số 
        //danh sách sv , tên sv cần tìm 
        //đầu ra :nêu scos thì in ra có sinh viên , nếu ko :ko có sinh viên 
        function timKiemSinhVien(ds, ten) {
            var coSinhVien = false;
            for (var i = 0; i < ds.length; i++) {
                if (ds[i] == ten) {
                    coSinhVien = true;
                }
            }
            if ( coSinhVien == true){
                document.writeln("có sinh viên  " +ten + "trong danh sách" );
            }
            else{
                document.writeln("không có  sinh viên  " +ten + " trong danh sách " );
            }

        }
         timKiemSinhVien(danhSachSinhVien,"thuy");

         







    </script>

</body>

</html>
